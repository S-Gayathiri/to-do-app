<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle border -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>

  <!-- Matrix Grid 2x2 Accent Glow -->
  <g filter="url(#glow)">
    <!-- Q1 Urgent & Important (Top Left) - Flame Pink -->
    <rect x="96" y="96" width="144" height="144" rx="24" fill="#ef4444" fill-opacity="0.85"/>
    <!-- Q2 Schedule (Top Right) - Indigo/Blue -->
    <rect x="272" y="96" width="144" height="144" rx="24" fill="#6366f1" fill-opacity="0.85"/>
    <!-- Q3 Delegate (Bottom Left) - Amber -->
    <rect x="96" y="272" width="144" height="144" rx="24" fill="#f59e0b" fill-opacity="0.85"/>
    <!-- Q4 Backlog (Bottom Right) - Emerald -->
    <rect x="272" y="272" width="144" height="144" rx="24" fill="#10b981" fill-opacity="0.85"/>
  </g>

  <!-- Checkmark Overlay in Center -->
  <circle cx="256" cy="256" r="64" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="8"/>
  <path d="M232 258 L248 274 L282 238" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating Urgent Lightning in Q1 -->
  <path d="M168 140 L156 168 L174 168 L160 196 L180 160 L168 160 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Floating Star in Q2 -->
  <path d="M344 144 L348 156 L360 157 L351 165 L354 177 L344 170 L334 177 L337 165 L328 157 L340 156 Z" fill="#ffffff" opacity="0.95"/>
</svg>
